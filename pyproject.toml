[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aave-evidence-analyst"
version = "0.1.0"
description = "Vietnamese Aave V3 analyst with query and evidence verification"
requires-python = ">=3.11"
dependencies = ["boto3", "duckdb", "pandas", "pyarrow", "pytz", "sqlglot", "rank-bm25", "streamlit", "beautifulsoup4", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
aave-analyst = "aave_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
